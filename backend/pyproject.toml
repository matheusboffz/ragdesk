[project]
name = "ragdesk-backend"
version = "0.1.0"
description = "RAGDesk Backend API - Retrieval-Augmented Generation Help Desk with citations and auto-ticketing"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "psycopg[binary]>=3.2.3,<4.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "pwdlib[argon2]>=0.2.1,<1.0.0",
    "pypdf>=5.1.0,<6.0.0",
    "python-multipart>=0.0.17,<1.0.0",
    "httpx>=0.27.2,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.7.3,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
