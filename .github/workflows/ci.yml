name: RAGDesk CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-ci:
    name: Backend (Ruff, Alembic & Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragdesk
          POSTGRES_PASSWORD: ragdesk_test_password
          POSTGRES_DB: ragdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragdesk -d ragdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "./backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Verify Alembic migrations on PostgreSQL + pgvector
        env:
          DATABASE_URL: postgresql+psycopg://ragdesk:ragdesk_test_password@localhost:5432/ragdesk_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run Pytest suite
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://ragdesk:ragdesk_test_password@localhost:5432/ragdesk_test
          TEST_DATABASE_URL: postgresql+psycopg://ragdesk:ragdesk_test_password@localhost:5432/ragdesk_test
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
        run: pytest -v

  frontend-ci:
    name: Frontend (ESLint & Next.js Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build
